<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Molseal: a molecular key that reads "mos". The m is a 2-methylpentyl
       chain, the o a thiane ring and the S its sulfur:
       4-(2-methylpentyl)thiane, CCCC(C)CC1CCSCC1.
       Ink flips to paper and the gradient lifts in dark mode. -->
  <style>
    .k { stroke: #0b0b0d; }
    .g0 { stop-color: #ff6a5c; } .g1 { stop-color: #d81b60; } .g2 { stop-color: #6a1b9a; }
    @media (prefers-color-scheme: dark) {
      .k { stroke: #fafafa; }
      .g0 { stop-color: #ff7a6b; } .g1 { stop-color: #ec4384; } .g2 { stop-color: #a24ad6; }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="16.5" y1="21.2" x2="26.9" y2="10.8">
      <stop offset="0" class="g0"/>
      <stop offset="0.5" class="g1"/>
      <stop offset="1" class="g2"/>
    </linearGradient>
  </defs>
  <path d="M26.4 12.36 L25.5 10.8 L19.5 10.8 L16.5 16 L19.5 21.2 L25.5 21.2 L26.4 19.64" fill="none" stroke="url(#g)" stroke-width="2.2"/>
  <path class="k" d="M16.5 16 L12.86 13.9 L9.22 16 L5.58 13.9 L1.94 16 V20.2 M9.22 16 V20.2" fill="none" stroke-width="2"/>
  <path class="k" d="M30.1 14.75 C29.75 14.3 29.2 14.05 28.6 14.05 C27.75 14.05 27.15 14.55 27.15 15.2 C27.15 15.85 27.75 16.05 28.6 16.25 C29.5 16.45 30.1 16.75 30.1 17.35 C30.1 17.95 29.45 18.4 28.6 18.4 C27.95 18.4 27.4 18.15 27.05 17.7" fill="none" stroke-width="1.5"/>
</svg>
